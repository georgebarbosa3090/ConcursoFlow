version: '3.8'

services:
  db:
    image: postgres:15
    container_name: concursoflow_db
    environment:
      POSTGRES_USER: concurso_user
      POSTGRES_PASSWORD: concurso_password
      POSTGRES_DB: concurso_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
